name: テスト

on:
    pull_request:
        branches: ['*']
    push:
        branches: [main, master]

jobs:
    test:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [18.x, 20.x]

        steps:
            - name: チェックアウト
              uses: actions/checkout@v4

            - name: Node.js ${{ matrix.node-version }} のセットアップ
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: 依存関係のインストール
              run: npm ci

            - name: リントとテストの実行
              run: npm test

            - name: ビルドの実行
              run: npm run build
